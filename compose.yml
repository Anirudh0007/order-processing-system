services:
  backend:
    build: .
    container_name: belp-backend
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped
  
  worker:
    build: .
    container_name: belp-worker
    command: npm run worker

    env_file:
      - .env
    depends_on: 
      - redis
    
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: belp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data: